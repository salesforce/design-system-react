name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # The Vitest `browser` project runs a small suite of real-browser tests
      # (focus traversal, text-truncation measurement, column widths) that jsdom
      # cannot cover. Install the Chromium binary it drives via Playwright.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Blocking gates (typecheck, test, build, lint) — these pass today and
      # must stay green. Same script contributors run locally.
      - name: Typecheck, test, build, lint
        run: npm run test:ci

  # Public API snapshot: the committed api/ must match the declarations the
  # PR's code emits, so every type change is visible in the diff. PRs only:
  # pushes to master were already gated by their PR. Make `api` a required
  # status check in branch protection for this to block merges.
  api:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The classifier compares against the merge base with the PR's base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Check public API snapshot
        run: npm run api:check

      # Advisory: classify type changes against the base branch as breaking,
      # possibly breaking or additive. Always exits 0; reports through
      # annotations on the api/ diff, the job summary, and one PR comment
      # (skipped for fork PRs, whose token can't comment).
      - name: Classify public type changes
        if: always() && steps.install.outcome == 'success'
        run: npm run --silent api:compat
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          API_COMPAT_COMMENT: ${{ github.event.pull_request.head.repo.fork && '0' || '1' }}
          GH_TOKEN: ${{ github.token }}
