name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # The Vitest `browser` project runs a small suite of real-browser tests
      # (focus traversal, text-truncation measurement, column widths) that jsdom
      # cannot cover. Install the Chromium binary it drives via Playwright.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Blocking gates — these pass today and must stay green.
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
