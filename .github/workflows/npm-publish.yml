# Publishes the package to npm when a GitHub Release is created.
# The prepack script (npm run build) produces the Vite dist/ that package.json
# points at; the files field limits the published tarball to dist/ + docs.
name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test, build
        run: |
          npm run typecheck
          npm run test -- --run
          npm run build
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
