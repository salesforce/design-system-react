# Publishes the package to npm when a GitHub Release is created.
# The prepack script (npm run build) produces the Vite dist/ that package.json
# points at; the files field limits the published tarball to dist/ + docs.
name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # The Vitest `browser` project runs a small suite of real-browser tests
      # (focus traversal, text-truncation measurement, column widths) that jsdom
      # cannot cover. Install the Chromium binary it drives via Playwright.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Blocking gates — these pass today and must stay green.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
